# Runs lint and the full test suite on Node 22 and 24, for every push to main
# and every pull request. Screenshots (including failure screenshots) are kept
# as a downloadable artifact.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow never needs to write to the repository.
permissions:
  contents: read

# A newer push to a pull request cancels the run it replaces. Each run on main
# gets its own group, so no commit on main is ever cancelled or skipped.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (with Linux system libraries)
        id: chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Test
        # Runs even when lint failed, so one push reports both results.
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: npm test

      - name: Upload screenshots
        # always(): also after a timeout or cancellation, when failure screenshots matter most.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-node-${{ matrix.node }}
          path: screenshots/
          if-no-files-found: ignore
